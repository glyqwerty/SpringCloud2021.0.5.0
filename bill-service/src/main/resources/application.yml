  application:
    name: bill-service
    qos-port: 33333
    qos-enable: true
    qos-accept-foreign-ip: false
  registry:
    address: nacos://localhost:8848?namespace=c73c948c-d8d7-4aa9-a10a-10e4cfcb5eeb&username=nacos&password=nacos&register-consumer-url=true

