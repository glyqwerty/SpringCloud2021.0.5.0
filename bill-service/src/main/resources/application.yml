
spring:
  servlet:
    multipart:
      max-request-size: 2000MB
      max-file-size: 2000MB
  #  application:
#    name: bill-server
  profiles:
    active: prod
    include: seata,sentinel,druid,redis
    # rocketmq
  cloud:
    nacos:
      config:
        username: nacos
        password: nacos
        contextPath: /nacos
        serverAddr: localhost:8848
        #        prefix: bill-server
        #        file-extension: yaml  # 配置文件格式
        #        # 使用id
        namespace: microservices
        group: DEFAULT_GROUP
  #        refresh-enabled: true
  #
  config:
    import:
      - optional:nacos:bill-server-prod.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:datasource-config.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:redis-config.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:rocketmq-config.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:seata-config.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:sentinel-config.yaml?group=DEFAULT_GROUP&refreshEnabled=true


